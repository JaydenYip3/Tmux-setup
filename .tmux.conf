# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display "reloaded"

# Vim-style pane navigation
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Splits, open in current directory
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Enable mouse support
set -g mouse on

# Better colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Start window numbering at 1
set -g base-index 1
set -g renumber-windows on

# Auto focus
set -g focus-events on

# Start pane numbering at 1
set -g pane-base-index 1

# Responsiveness and scrollback
set -sg escape-time 10
set -g history-limit 50000

#linked with symlink @code repo

# Vi keys in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Disable auto-copy on mouse drag release — use Cmd+C to copy manually
bind -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode MouseDragEnd1Pane send -X stop-selection
set -s set-clipboard off

# Swap windows
bind-key -n C-S-h swap-window -t -1
bind-key -n C-S-l swap-window -t +1
